<style>
:root{
  --bg:#0a0a0b; --bg2:#111113; --card:#121214; --ink:#f3f3ee; --muted:#a9a9a2; --line:#34343a;
  --accent:#c6ff3d; --accent-ink:#c6ff3d; --on-accent:#0a0a0b; --grain:rgba(255,255,255,.035);
  --glare:rgba(255,255,255,.14);
  --display: Impact, "Arial Narrow", "Helvetica Neue Condensed", ui-sans-serif, system-ui, sans-serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f3ec; --bg2:#ebeae2; --card:#fffffa; --ink:#0d0d0c; --muted:#4c4c47; --line:#1d1d1b;
    --accent:#c6ff3d; --accent-ink:#3b5400; --on-accent:#0d0d0c; --grain:rgba(0,0,0,.04);
    --glare:rgba(255,255,255,.55);
    color-scheme: light;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}
body{
  margin:0; background-color:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.45;
  background-image:
    repeating-radial-gradient(circle at 17% 23%, var(--grain) 0 1px, transparent 1px 3px),
    repeating-radial-gradient(circle at 71% 64%, var(--grain) 0 1px, transparent 1px 4px);
  min-height:100vh; overflow-x:clip;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent-ink); outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:1280px; margin:0 auto; padding:0 clamp(16px,3vw,40px)}

/* Header */
header{border-bottom:1px solid var(--line); padding-top:clamp(20px,4vw,48px)}
.kicker{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:.8rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
.status{display:inline-flex; align-items:center; gap:8px; min-height:32px; padding:4px 12px; border:1px solid var(--line); color:var(--ink); background:var(--bg2)}
.status::before{content:""; width:8px; height:8px; background:var(--muted)}
.status.live::before{background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
h1{
  font-family:var(--display); font-weight:900; text-transform:uppercase; letter-spacing:-.01em;
  font-size:clamp(4rem,17vw,13.5rem); line-height:.82; margin:.18em 0 .12em; overflow-wrap:anywhere;
  background:linear-gradient(100deg,var(--ink) 0%,var(--ink) 38%,var(--accent) 50%,var(--ink) 62%,var(--ink) 100%);
  background-size:260% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:sheen 9s ease-in-out infinite;
}
h1 span{display:block}
h1 span:last-child{padding-left:clamp(0px,12vw,180px)}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.lede{max-width:52ch; font-size:clamp(1rem,1.6vw,1.2rem); color:var(--muted); margin:0 0 24px}
.lede strong{color:var(--ink)}
.ticker{border-top:1px solid var(--line); overflow:hidden; white-space:nowrap; padding:10px 0; font-family:var(--display); font-size:clamp(1rem,2.4vw,1.5rem); text-transform:uppercase}
.ticker-track{display:inline-flex; gap:0; animation:marquee 60s linear infinite; will-change:transform}
.ticker-track span{padding:0 1.2em}
.ticker-track span::after{content:"✦"; color:var(--accent-ink); margin-left:1.2em}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Filters */
.filters{position:static; margin:28px 0 20px; border:1px solid var(--line); background:var(--bg2)}
.filters-toggle{display:none; width:100%; min-height:48px; align-items:center; justify-content:space-between; padding:0 16px; background:transparent; color:var(--ink); border:0; font:700 1rem var(--sans); text-transform:uppercase; letter-spacing:.08em; cursor:pointer}
.filters-toggle .chev{transition:transform .2s}
.filters-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.filters-body{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr); gap:16px; padding:16px}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field label,.legend{font-family:var(--mono); font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
input[type=search],select{
  width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:0;
  background:var(--card); color:var(--ink); font:1rem var(--sans);
}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%); background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%; background-size:6px 6px; background-repeat:no-repeat; padding-right:32px}
.topics{grid-column:1/-1; border:0; margin:0; padding:0; min-width:0}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.chip-btn{min-height:40px; padding:6px 14px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:600 .9rem var(--mono); cursor:pointer; max-width:100%; overflow-wrap:anywhere}
.chip-btn:hover{border-color:var(--accent-ink)}
.chip-btn[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.bar-foot{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding-top:12px}
.count{font-family:var(--mono); font-size:.9rem}
.count b{font-family:var(--display); font-size:1.6rem; font-weight:400; color:var(--accent-ink); margin-right:4px}
.btn{min-height:40px; padding:6px 16px; border:1px solid var(--ink); background:transparent; color:var(--ink); font:700 .85rem var(--sans); text-transform:uppercase; letter-spacing:.08em; cursor:pointer}
.btn:hover{background:var(--ink); color:var(--bg)}

/* Grid */
main{padding-bottom:80px}
.grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px 24px; align-items:start}
.grid > .card:nth-child(3n+2){margin-top:56px}
.grid > .card:nth-child(3n){margin-top:22px}
.card{position:relative; min-width:0}
.card.enter{animation:rise .6s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0; transform:translateY(24px)}to{opacity:1; transform:none}}
.card-in{
  position:relative; height:100%; min-height:250px; display:flex; flex-direction:column; gap:12px;
  padding:20px 20px 18px; background:var(--card); border:1px solid var(--line); overflow:hidden;
  transform-style:preserve-3d; transition:transform .25s ease, border-color .25s, box-shadow .25s;
  --gx:50%; --gy:50%;
}
.card-in::before{ /* accent edge */
  content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent);
  transform:scaleY(.18); transform-origin:top; transition:transform .45s cubic-bezier(.2,.7,.2,1);
}
.card-in::after{ /* glare */
  content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s;
  background:radial-gradient(circle at var(--gx) var(--gy), var(--glare), transparent 55%);

.card:hover .card-in{border-color:var(--accent); box-shadow:0 18px 40px -18px rgba(0,0,0,.6), 6px 6px 0 -1px var(--accent); transform:translateY(-4px)}
.card:hover .card-in::before,.card:focus-within .card-in::before{transform:scaleY(1)}
.card:hover .card-in::after{opacity:1}
.card:focus-within .card-in{border-color:var(--accent)}
.rank{

  transition:-webkit-text-stroke-color .25s;

.card:hover .rank{-webkit-text-stroke-color:var(--accent-ink)}
.card h2{margin:0; padding-right:88px; font-family:var(--display); font-weight:400; font-size:1.45rem; line-height:1.08; letter-spacing:.01em; overflow-wrap:anywhere}
.card h2 a{text-decoration:none}
.card h2 a:hover{text-decoration:underline; text-decoration-color:var(--accent-ink); text-underline-offset:4px}
.card h2 a::after{content:""; position:absolute; inset:0; z-index:1} /* whole card clickable via single link */
.owner{display:block; font-family:var(--mono); font-size:.78rem; color:var(--muted); letter-spacing:.02em; margin-bottom:2px}
.desc{margin:0; color:var(--muted); font-size:.95rem; display:-webkit-box; -webkit-line-clamp:3; line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none}
.tags li{font:.75rem var(--mono); padding:3px 8px; border:1px solid var(--line); color:var(--ink); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meta{margin-top:auto; display:grid; grid-template-columns:repeat(4,minmax(0,auto)); justify-content:space-between; gap:8px; border-top:1px solid var(--line); padding-top:12px; font:.8rem var(--mono)}
.meta div{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.meta dt{color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.1em}
.meta dd{margin:0; color:var(--ink); font-weight:700; overflow:hidden; text-overflow:ellipsis}
.meta .stars dd{color:var(--accent-ink)}
.empty{grid-column:1/-1; border:1px dashed var(--line); padding:48px 24px; text-align:center}
.empty p{font-family:var(--display); font-size:clamp(1.8rem,5vw,3rem); margin:0 0 16px; text-transform:uppercase}
footer{border-top:1px solid var(--line); padding:24px 0 40px; font:.8rem var(--mono); color:var(--muted)}

@media (max-width:1023px){

  .grid > .card:nth-child(2n){margin-top:40px}
  .filters-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .filters-body .search{grid-column:1/-1}
}
@media (max-width:599px){

  .filters-toggle{display:flex}
  .filters-body{grid-template-columns:minmax(0,1fr); border-top:1px solid var(--line)}
  .filters-body[data-open="false"]{display:none}
  .rank{font-size:5rem}
  .card h2{padding-right:70px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
  .ticker-track{transform:none}
  .card:hover .card-in{transform:none}
}

<script>
(function(){
  'use strict';
  var TOPICS = ['ai-agents','llm-agents','agentic-ai','autonomous-agents'];
  var $ = function(id){ return document.getElementById(id); };
  var grid = $('grid'), statusEl = $('status'), countEl = $('count'), qEl = $('q'),
      langEl = $('lang'), sortEl = $('sort'), chipsEl = $('topicChips'), toggle = $('filtersToggle'),
      body = $('filtersBody');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  var state = { q:'', lang:'', sort:'stars', topics:new Set() };
  var items = [], cache = new Map(), firstRender = true;

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(n){
    n = Number(n) || 0;
    if (n >= 1e6) return (n/1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/,'') + 'M';
    if (n >= 1e3) return (n/1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/,'') + 'k';
    return String(n);
  }
  function rel(iso){
    var t = Date.parse(iso); if (isNaN(t)) return 'n/a';
    var s = Math.max(0, (Date.now() - t) / 1000);
    var units = [[31536000,'y'],[2592000,'mo'],[604800,'w'],[86400,'d'],[3600,'h'],[60,'m']];
    for (var i = 0; i < units.length; i++) if (s >= units[i][0]) return Math.floor(s/units[i][0]) + units[i][1] + ' ago';
    return 'just now';
  }
  function trim(r){
    return { id:r.id, full_name:String(r.full_name||''), html_url:String(r.html_url||''),
      description:r.description == null ? null : String(r.description),
      stargazers_count:r.stargazers_count|0, forks_count:r.forks_count|0,
      language:r.language == null ? null : String(r.language),
      topics:Array.isArray(r.topics) ? r.topics.map(String) : [], pushed_at:String(r.pushed_at||'') };
  }
  function mergeSort(lists){
    var m = new Map();
    lists.forEach(function(l){ (l||[]).forEach(function(r){ if (r && !m.has(r.id)) m.set(r.id, trim(r)); }); });
    return Array.from(m.values()).sort(function(a,b){ return b.stargazers_count - a.stargazers_count; });
  }
  function safeUrl(u){ return /^https:\/\/github\.com\//.test(u) ? u : 'https://github.com/'; }

  function setStatus(kind, when){
    statusEl.classList.toggle('live', kind === 'live');
    var d = new Date(when);
    if (kind === 'live') {
      statusEl.textContent = 'Live · updated ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    } else {
      statusEl.textContent = 'Snapshot · ' + (isNaN(d) ? 'bundled' : d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}));
    }
  }

  function buildCard(r){
    var art = el('article','card'); art.dataset.id = r.id;
    var inner = el('div','card-in'); art.appendChild(inner);
    var rank = el('span','rank'); rank.setAttribute('aria-hidden','true'); inner.appendChild(rank);
    var parts = r.full_name.split('/');
    var h = el('h2'); var a = el('a'); a.href = safeUrl(r.html_url); a.rel = 'noopener'; a.target = '_blank';
    var sr = el('span','sr-only rank-sr');
    a.appendChild(sr);
    a.appendChild(el('span','owner', (parts[0]||'') + ' /'));
    a.appendChild(document.createTextNode(parts.slice(1).join('/') || r.full_name));
    h.appendChild(a); inner.appendChild(h);
    inner.appendChild(el('p','desc', r.description || 'No description provided.'));
    if (r.topics.length){
      var ul = el('ul','tags'); ul.setAttribute('aria-label','Topics');
      r.topics.slice(0,4).forEach(function(t){ ul.appendChild(el('li',null,t)); });
      inner.appendChild(ul);
    }
    var dl = el('dl','meta');
    [['stars','Stars',fmt(r.stargazers_count)],['forks','Forks',fmt(r.forks_count)],
     ['lang','Lang',r.language || 'n/a'],['pushed','Pushed',rel(r.pushed_at)]].forEach(function(f){
      var d = el('div', f[0]); d.appendChild(el('dt',null,f[1])); d.appendChild(el('dd',null,f[2])); dl.appendChild(d);
    });
    dl.lastChild.title = r.pushed_at;
    inner.appendChild(dl);
    return art;
  }

  function matches(r){
    if (state.lang && (r.language || 'n/a') !== state.lang) return false;
    if (state.topics.size){
      var ok = false; for (var i = 0; i < r.topics.length; i++) if (state.topics.has(r.topics[i])) { ok = true; break; }
      if (!ok) return false;
    }
    if (state.q){
      var hay = (r.full_name + ' ' + (r.description||'') + ' ' + r.topics.join(' ')).toLowerCase();
      if (hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }
  var sorters = {
    stars:function(a,b){ return b.stargazers_count - a.stargazers_count; },
    forks:function(a,b){ return b.forks_count - a.forks_count || b.stargazers_count - a.stargazers_count; },
    pushed:function(a,b){ return Date.parse(b.pushed_at) - Date.parse(a.pushed_at); },
    name:function(a,b){ return a.full_name.localeCompare(b.full_name, undefined, {sensitivity:'base'}); }
  };

  function render(){
    var list = items.filter(matches).sort(sorters[state.sort] || sorters.stars);
    var animate = !firstRender && !reduced.matches && typeof Element.prototype.animate === 'function';
    var before = new Map();
    if (animate) Array.prototype.forEach.call(grid.children, function(c){ if (c.dataset.id) before.set(c.dataset.id, c.getBoundingClientRect()); });
    var frag = document.createDocumentFragment();
    list.forEach(function(r, i){
      var c = cache.get(r.id); if (!c){ c = buildCard(r); cache.set(r.id, c); }
      var n = String(i + 1).padStart(2,'0');
      c.querySelector('.rank').textContent = n;
      c.querySelector('.rank-sr').textContent = 'Rank ' + (i + 1) + ': ';
      if (firstRender && !reduced.matches){ c.classList.add('enter'); c.style.setProperty('--i', Math.min(i, 18)); }
      frag.appendChild(c);
    });
    grid.replaceChildren(frag);
    if (!list.length){
      var e = el('div','empty');
      e.appendChild(el('p',null,'Nothing on the radar'));
      e.appendChild(el('div',null,'No repos match these filters.'));
      var b = el('button','btn','Reset'); b.type = 'button'; b.style.marginTop = '16px'; b.addEventListener('click', reset);
      e.appendChild(b); grid.appendChild(e);
    }
    countEl.replaceChildren(el('b',null,String(list.length)), document.createTextNode(list.length === 1 ? 'repo shown' : 'repos shown'), document.createTextNode(' of ' + items.length));
    if (animate){
      list.forEach(function(r){
        var c = cache.get(r.id), f = before.get(String(r.id)), l = c.getBoundingClientRect();
        if (f){
          var dx = f.left - l.left, dy = f.top - l.top;
          if (dx || dy) c.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.7,.2,1)'});
        } else {
          c.animate([{opacity:0, transform:'scale(.97)'},{opacity:1, transform:'none'}],{duration:260,easing:'ease-out'});
        }
      });
    }
    firstRender = false;
  }

  function buildControls(){
    var langs = new Map();
    items.forEach(function(r){ var l = r.language || 'n/a'; langs.set(l, (langs.get(l)||0) + 1); });
    var cur = state.lang;
    langEl.replaceChildren(new Option('All',''));
    Array.from(langs.entries()).sort(function(a,b){ return b[1]-a[1] || a[0].localeCompare(b[0]); }).forEach(function(e){
      langEl.appendChild(new Option(e[0] + ' (' + e[1] + ')', e[0]));
    });
    if (!langs.has(cur)) state.lang = '';
    langEl.value = state.lang;

    var freq = new Map();
    items.forEach(function(r){ r.topics.forEach(function(t){ if (TOPICS.indexOf(t) === -1) freq.set(t,(freq.get(t)||0)+1); }); });
    var extra = Array.from(freq.entries()).sort(function(a,b){ return b[1]-a[1] || a[0].localeCompare(b[0]); }).slice(0,8).map(function(e){ return e[0]; });
    chipsEl.replaceChildren();
    TOPICS.concat(extra).forEach(function(t){
      var b = el('button','chip-btn',t); b.type = 'button'; b.dataset.topic = t;
      b.setAttribute('aria-pressed', state.topics.has(t) ? 'true' : 'false');
      chipsEl.appendChild(b);
    });

    var names = items.slice(0,14).map(function(r){ return r.full_name; });
    var track = $('ticker'); track.replaceChildren();
    names.concat(names).forEach(function(n){ track.appendChild(el('span',null,n)); });
  }

  function setData(list){
    items = list; cache = new Map();
    buildControls(); render();
  }

  function reset(){
    state.q = ''; state.lang = ''; state.sort = 'stars'; state.topics.clear();
    qEl.value = ''; langEl.value = ''; sortEl.value = 'stars';
    chipsEl.querySelectorAll('.chip-btn').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
    render();
  }

  // Controls
  var timer;
  qEl.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){ state.q = qEl.value.trim().toLowerCase(); render(); }, 150);
  });
  qEl.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ clearTimeout(timer); qEl.value = ''; if (state.q){ state.q = ''; render(); } }
  });
  langEl.addEventListener('change', function(){ state.lang = langEl.value; render(); });
  sortEl.addEventListener('change', function(){ state.sort = sortEl.value; render(); });
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('.chip-btn'); if (!b) return;
    var t = b.dataset.topic;
    if (state.topics.has(t)) state.topics.delete(t); else state.topics.add(t);
    b.setAttribute('aria-pressed', state.topics.has(t) ? 'true' : 'false');
    render();
  });
  $('resetTop').addEventListener('click', reset);
  toggle.addEventListener('click', function(){
    var open = toggle.getAttribute('aria-expanded') !== 'true';
    toggle.setAttribute('aria-expanded', String(open));
    body.dataset.open = String(open);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey){
      var t = e.target, tag = t && t.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
      e.preventDefault();
      if (getComputedStyle(body).display === 'none'){ toggle.setAttribute('aria-expanded','true'); body.dataset.open = 'true'; }
      qEl.focus();
    } else if (e.key === 'Escape' && document.activeElement !== qEl && qEl.value){
      qEl.value = ''; state.q = ''; render();
    }
  });

  // Tilt + glare (pointer devices only)
  var tiltTarget = null, tx = 0, ty = 0, gx = 50, gy = 50, raf = 0;
  function paint(){
    raf = 0;
    if (!tiltTarget) return;
    tiltTarget.style.transform = 'perspective(900px) rotateX(' + ty.toFixed(2) + 'deg) rotateY(' + tx.toFixed(2) + 'deg) translateY(-4px)';
    tiltTarget.style.setProperty('--gx', gx.toFixed(1) + '%');
    tiltTarget.style.setProperty('--gy', gy.toFixed(1) + '%');
  }
  function clearTilt(t){ if (t){ t.style.transform = ''; t.style.removeProperty('--gx'); t.style.removeProperty('--gy'); } }
  grid.addEventListener('pointermove', function(e){
    if (reduced.matches || e.pointerType === 'touch') return;
    var inner = e.target.closest && e.target.closest('.card-in'); if (!inner) return;
    if (tiltTarget && tiltTarget !== inner) clearTilt(tiltTarget);
    tiltTarget = inner;
    var r = inner.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    tx = (px - .5) * 16; ty = (.5 - py) * 16; gx = px * 100; gy = py * 100;
    if (!raf) raf = requestAnimationFrame(paint);
  });
  grid.addEventListener('pointerleave', function(){ clearTilt(tiltTarget); tiltTarget = null; });
  grid.addEventListener('pointerout', function(e){
    if (!tiltTarget) return;
    var to = e.relatedTarget;
    if (!to || !tiltTarget.contains(to)) { clearTilt(tiltTarget); tiltTarget = null; }
  });
  grid.addEventListener('animationend', function(e){ if (e.target.classList && e.target.classList.contains('card')) e.target.classList.remove('enter'); });

  // Data loading: live API -> data.json (http only) -> embedded snapshot
  function embedded(){
    try { return JSON.parse($('snapshot').textContent); } catch (err) { return { generated_at:null, items:[] }; }
  }
  function fetchJSON(url, ms){
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var to = setTimeout(function(){ if (ctl) ctl.abort(); }, ms);
    return fetch(url, { signal: ctl ? ctl.signal : undefined, headers: url.indexOf('api.github.com') > -1 ? { 'Accept':'application/vnd.github+json' } : undefined })
      .then(function(r){ clearTimeout(to); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); },
            function(err){ clearTimeout(to); throw err; });
  }
  function live(){
    var since = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);
    return Promise.all(TOPICS.map(function(t){
      var q = encodeURIComponent('topic:' + t + ' pushed:>=' + since);
      return fetchJSON('https://api.github.com/search/repositories?q=' + q + '&sort=stars&order=desc&per_page=30', 9000)
        .then(function(j){ if (!j || !Array.isArray(j.items)) throw new Error('bad payload'); return j.items; });
    })).then(mergeSort);
  }
  function useSnapshot(s){
    var list = mergeSort([s && s.items]);
    if (!list.length) throw new Error('empty');
    setData(list); setStatus('snapshot', s.generated_at);
  }

  var snap = embedded();
  var isFile = location.protocol === 'file:';
  useSnapshot(snap); // immediate paint from embedded copy

  if (!isFile && typeof fetch === 'function'){
    live().then(function(list){
      if (!list.length) throw new Error('empty');
      setData(list); setStatus('live', Date.now());
    }).catch(function(){
      return fetchJSON('data.json', 6000).then(function(s){ useSnapshot(s); }).catch(function(){ /* keep embedded */ });
    });
  }
})();
</script>
</body>
</html>
